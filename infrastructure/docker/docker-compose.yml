# Local development Docker Compose definition
# See root /docker-compose.yml for primary orchestration entrypoint
version: '3.8'

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: horizon-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-horizon_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-horizon_password}
      POSTGRES_DB: ${POSTGRES_DB:-horizon_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-horizon_user} -d ${POSTGRES_DB:-horizon_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-03-03T17-50-24Z
    container_name: horizon-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

volumes:
  postgres_data:
    driver: local
  minio_data:
    driver: local
